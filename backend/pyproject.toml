[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-backend"
version = "0.1.0"
description = "FastAPI workflow service for NEXUS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "firebase-admin>=6.6,<8.0",
  "google-cloud-firestore>=2.18,<3.0",
  "google-antigravity>=0.1.18,<1.0",
  "google-genai>=1.0,<2.0",
  "google-cloud-storage>=2.18,<4.0",
  "langgraph>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "nexus_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
